<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة فينوم جيم 👑</title>
    <style>
        :root { --main-color: #ff4757; --bg-dark: #0a0a0a; --card-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; margin: 0; padding: 0; }
        
        /* شريط التنقل العلوي */
        .navbar { background: var(--card-bg); display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--main-color); position: sticky; top: 0; z-index: 100; }
        .nav-btn { color: #aaa; text-decoration: none; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--main-color); border-bottom: 2px solid var(--main-color); padding-bottom: 5px; }

        .container { padding: 20px; max-width: 600px; margin: auto; }
        .page { display: none; } /* إخفاء كل الصفحات افتراضياً */
        .page.active { display: block; } /* إظهار الصفحة النشطة فقط */

        h2 { border-right: 4px solid var(--main-color); padding-right: 10px; margin-bottom: 25px; }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #222; color: white; font-size: 16px; box-sizing: border-box; }
        
        button.action-btn { background: var(--main-color); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 17px; }

        /* ستايل قائمة الأعضاء */
        .user-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .user-card:active { transform: scale(0.98); }

        /* شاشة التعديل المنفصلة */
        .edit-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 200; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-btn active" id="navAdd" onclick="showPage('addPage')">➕ إضافة مشترك</div>
        <div class="nav-btn" id="navMembers" onclick="showPage('membersPage')">👥 قائمة المشتركين</div>
    </div>

    <div class="container">
        
        <div id="addPage" class="page active">
            <h2>إضافة بطل جديد 🔥</h2>
            <input type="text" id="newName" placeholder="اسم المشترك (مثلاً: محمد أحمد)">
            <textarea id="newFood" placeholder="نظام التغذية..." rows="4"></textarea>
            <textarea id="newGym" placeholder="برنامج التمرين..." rows="4"></textarea>
            <button class="action-btn" onclick="saveNewUser()">حفظ ونشر البيانات 💾</button>
        </div>

        <div id="membersPage" class="page">
            <h2>المشتركين الحاليين 👥</h2>
            <input type="text" id="searchBar" placeholder="🔍 ابحث بالاسم (مثلاً: محمد)..." oninput="searchUsers()">
            <div id="usersList" style="margin-top: 20px;">
                <p style="color:#666; text-align:center;">جاري تحميل البيانات...</p>
            </div>
        </div>

    </div>

    <div id="editOverlay" class="edit-overlay">
        <button onclick="closeEdit()" style="background:#444; color:white; border:none; padding:10px; border-radius:5px; margin-bottom:20px;">⬅️ العودة للقائمة</button>
        <h2>تعديل بيانات: <span id="editingNameDisplay" style="color:var(--main-color)"></span></h2>
        
        <label>🥗 نظام التغذية:</label>
        <textarea id="editFood" rows="6"></textarea>
        
        <label>💪 برنامج التمرين:</label>
        <textarea id="editGym" rows="6"></textarea>

        <button class="action-btn" onclick="updateUser()" style="background:#2ed573; margin-top:20px;">تحديث البيانات ✅</button>
        <button class="action-btn" onclick="deleteUser()" style="background:#ff4757; margin-top:10px;">حذف العضو نهائياً 🗑️</button>
    </div>

    <script>
        const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com/users";
        let allUsersData = {};
        let currentEditing = "";

        // وظيفة التنقل بين الصفحات
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'addPage') document.getElementById('navAdd').classList.add('active');
            if(pageId === 'membersPage') {
                document.getElementById('navMembers').classList.add('active');
                loadUsersList();
            }
        }

        // حفظ عضو جديد
        async function saveNewUser() {
            const name = document.getElementById('newName').value.trim();
            const food = document.getElementById('newFood').value.trim();
            const gym = document.getElementById('newGym').value.trim();
            if(!name) return alert("الاسم مطلوب!");

            await fetch(`${dbURL}/${name}.json`, {
                method: 'PUT',
                body: JSON.stringify({ foodPlan: food, gymPlan: gym })
            });
            alert("تمت الإضافة بنجاح!");
            document.getElementById('newName').value = '';
            document.getElementById('newFood').value = '';
            document.getElementById('newGym').value = '';
            showPage('membersPage');
        }

        // تحميل قائمة الأعضاء
        async function loadUsersList() {
            const res = await fetch(`${dbURL}.json`);
            allUsersData = await res.json() || {};
            displayUsers(allUsersData);
        }

        // عرض الأعضاء
        function displayUsers(data) {
            const list = document.getElementById('usersList');
            list.innerHTML = '';
            Object.keys(data).forEach(name => {
                const div = document.createElement('div');
                div.className = 'user-card';
                div.onclick = () => openEdit(name);
                div.innerHTML = `<span>👤 ${name}</span> <span style="color:#666">تعديل ></span>`;
                list.appendChild(div);
            });
        }

        // البحث الذكي
        function searchUsers() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const filtered = {};
            Object.keys(allUsersData).forEach(name => {
                if(name.toLowerCase().includes(term)) filtered[name] = allUsersData[name];
            });
            displayUsers(filtered);
        }

        // فتح شاشة التعديل
        function openEdit(name) {
            currentEditing = name;
            document.getElementById('editingNameDisplay').innerText = name;
            document.getElementById('editFood').value = allUsersData[name].foodPlan || "";
            document.getElementById('editGym').value = allUsersData[name].gymPlan || "";
            document.getElementById('editOverlay').style.display = 'block';
        }

        function closeEdit() { document.getElementById('editOverlay').style.display = 'none'; }

        // تحديث بيانات
        async function updateUser() {
            const food = document.getElementById('editFood').value;
            const gym = document.getElementById('editGym').value;
            await fetch(`${dbURL}/${currentEditing}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ foodPlan: food, gymPlan: gym })
            });
            alert("تم التحديث!");
            loadUsersList();
            closeEdit();
        }

        // حذف عضو
        async function deleteUser() {
            if(confirm(`حذف ${currentEditing}؟ لا يمكن التراجع!`)) {
                await fetch(`${dbURL}/${currentEditing}.json`, { method: 'DELETE' });
                alert("تم الحذف!");
                loadUsersList();
                closeEdit();
            }
        }
    </script>
</body>
</html>
