<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة VENOM GYM 👑</title>
    <style>
        :root { --main-color: #ff4757; --bg-dark: #0a0a0a; --card-bg: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg-dark); color: white; margin: 0; padding-bottom: 50px; }
        .header { background: var(--card-bg); padding: 15px; text-align: center; border-bottom: 2px solid var(--main-color); position: sticky; top: 0; z-index: 100; }
        .tabs { display: flex; justify-content: space-around; background: #111; padding: 10px 0; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; padding: 10px; }
        .tab-btn.active { color: var(--main-color); border-bottom: 2px solid var(--main-color); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; margin: 10px 0; background: #222; color: white; border: 1px solid #333; box-sizing: border-box; }
        button { background: var(--main-color); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .user-card { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 5px solid var(--main-color); display: flex; justify-content: space-between; align-items: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; }
    </style>
</head>
<body>
<div class="header"><h2>👑 VENOM GYM ADMIN</h2></div>
<div class="tabs">
    <button class="tab-btn active" onclick="openSection('addSection', this)">➕ إضافة عضو</button>
    <button class="tab-btn" onclick="openSection('listSection', this); loadUsers();">👥 الأعضاء</button>
    <button class="tab-btn" onclick="openSection('searchSection', this)">🔍 سيرش</button>
</div>
<div class="container">
    <div id="addSection" class="section active">
        <h3>إضافة وحش جديد</h3>
        <input type="text" id="newName" placeholder="اسم العضو بالكامل">
        <textarea id="newFood" rows="3" placeholder="نظام التغذية"></textarea>
        <textarea id="newGym" rows="3" placeholder="برنامج التمرين"></textarea>
        <button onclick="saveUser('new')">حفظ العضو الجديد ✅</button>
    </div>
    <div id="listSection" class="section"><h3>قائمة المشتركين</h3><div id="usersContainer">جاري التحميل...</div></div>
    <div id="searchSection" class="section">
        <input type="text" id="searchInput" oninput="searchUsers()" placeholder="ابحث باسم العضو..">
        <div id="searchResults"></div>
    </div>
</div>
<div id="userModal" class="modal">
    <div class="modal-content">
        <h2 id="editHeader" style="color:var(--main-color)"></h2>
        <textarea id="editFood" rows="5"></textarea>
        <textarea id="editGym" rows="5"></textarea>
        <button onclick="saveUser('edit')">حفظ التعديلات ✅</button>
        <button onclick="closeModal()">إغلاق</button>
    </div>
</div>
<script>
    const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com/users";
    let allUsers = {};
    let currentEditName = "";
    function openSection(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
    async function loadUsers() {
        const res = await fetch(`${dbURL}.json`);
        allUsers = await res.json() || {};
        renderList(allUsers, 'usersContainer');
    }
    function renderList(data, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        for (let name in data) {
            container.innerHTML += `<div class="user-card" onclick="openUser('${name}')"><span>${name}</span><small>تعديل ⬅️</small></div>`;
        }
    }
    function openUser(name) {
        currentEditName = name;
        const user = allUsers[name];
        document.getElementById('editHeader').innerText = name;
        document.getElementById('editFood').value = user.foodPlan || "";
        document.getElementById('editGym').value = user.gymPlan || "";
        document.getElementById('userModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('userModal').style.display = 'none'; }
    async function saveUser(type) {
        const name = type === 'new' ? document.getElementById('newName').value.trim() : currentEditName;
        const food = type === 'new' ? document.getElementById('newFood').value : document.getElementById('editFood').value;
        const gym = type === 'new' ? document.getElementById('newGym').value : document.getElementById('editGym').value;
        await fetch(`${dbURL}/${name}.json`, { method: 'PUT', body: JSON.stringify({ foodPlan: food, gymPlan: gym }) });
        alert("تم الحفظ! 👑");
        closeModal(); loadUsers();
    }
</script>
</body>
</html>
