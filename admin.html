<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم فينوم 👑</title>
    <style>
        :root { --main: #ff4757; --dark: #0a0a0a; --card: #1a1a1a; --green: #2ed573; --purple: #9b59b6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; }
        .navbar { background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 100; }
        .nav-btn { color: #888; cursor: pointer; position: relative; font-weight: bold; padding: 5px; }
        .nav-btn.active { color: var(--main); border-bottom: 2px solid var(--main); }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        /* ضبط الحقول لتكون تحت بعضها وبشكل احترافي */
        input, textarea, select { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #444; background: #222; color: white; font-size: 15px; outline: none; box-sizing: border-box; display: block; }
        button.save-btn { background: var(--main); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .user-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid #444; position: relative; cursor: pointer; }
        .unread-badge { position: absolute; left: 15px; top: 35%; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; text-align: center; font-size: 12px; line-height: 20px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 500; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #adminChatBox { height: 250px; overflow-y: auto; background: #0d1418; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #333; }
        .a-msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 13px; }
        .from-admin { background: #005c4b; align-self: flex-end; }
        .from-user { background: #202c33; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="navbar">
        <div id="navAdd" class="nav-btn active" onclick="showP('add')">➕ إضافة بطل</div>
        <div id="navList" class="nav-btn" onclick="showP('list')">👥 إدارة المشتركين <span id="navBadge" style="color:red; font-size:12px; display:none">●</span></div>
    </div>

    <div class="container">
        <div id="add" class="page">
            <h2 style="text-align:center">تسجيل مشترك جديد 🔥</h2>
            <div class="card">
                <input type="text" id="nName" placeholder="اسم البطل">
                <input type="date" id="nDate" value="2026-05-07">
                <select id="nDuration"><option value="30">شهر واحد</option><option value="90">3 شهور</option></select>
                <textarea id="nFood" placeholder="نظام التغذية . . ." rows="3"></textarea>
                <textarea id="nGym" placeholder="برنامج التمرين . . ." rows="3"></textarea>
                <button class="save-btn" onclick="saveU()">حفظ البيانات 💾</button>
            </div>
        </div>

        <div id="list" class="page" style="display:none">
            <h2 style="text-align:center">إدارة الأبطال 🔍</h2>
            <input type="text" placeholder="ابحث بالاسم..." oninput="search(this.value)">
            <div id="uList"></div>
        </div>
    </div>

    <div id="editOverlay" class="overlay">
        <button onclick="closeEdit()" style="background:#333; color:white; border:none; padding:10px; border-radius:10px;">⬅️ رجوع</button>
        <div class="card" style="margin-top:15px;">
            <h3>تعديل بطل: <span id="hName" style="color:var(--main)"></span></h3>
            <textarea id="eFood" rows="4"></textarea>
            <textarea id="eGym" rows="4"></textarea>
            <button onclick="updateU()" style="background:var(--green); width:100%; border:none; padding:12px; border-radius:10px; font-weight:bold;">تحديث البيانات ✅</button>
        </div>
        <div class="card" style="border-color:var(--purple)">
            <h4>💬 الدردشة</h4>
            <div id="adminChatBox"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="aInput" placeholder="اكتب ردك..." style="margin:0; flex:1">
                <button onclick="sendA()" style="background:var(--purple); width:65px; border-radius:10px; border:none; color:white;">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com";
        let currE = "", cInt;

        function showP(p) {
            document.querySelectorAll('.page').forEach(x => x.style.display='none');
            document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
            document.getElementById(p).style.display='block';
            if(p==='add') document.getElementById('navAdd').classList.add('active');
            if(p==='list') { document.getElementById('navList').classList.add('active'); loadU(); }
        }

        async function saveU() {
            const name = document.getElementById('nName').value.trim();
            if(!name) return alert("اكتب الاسم!");
            const data = { startDate: document.getElementById('nDate').value, foodPlan: document.getElementById('nFood').value, gymPlan: document.getElementById('nGym').value };
            await fetch(`${dbURL}/users/${encodeURIComponent(name)}.json`, { method:'PUT', body: JSON.stringify(data) });
            alert("تم الحفظ!"); location.reload();
        }

        async function loadU() {
            const res = await fetch(`${dbURL}/users.json`);
            const allU = await res.json() || {};
            const list = document.getElementById('uList'); list.innerHTML = '';
            for(let name in allU) {
                const div = document.createElement('div'); div.className = 'user-card';
                div.onclick = () => openE(name, allU[name]);
                div.innerHTML = `<strong>👤 ${name}</strong>`;
                list.appendChild(div);
            }
        }

        function openE(name, u) {
            currE = name;
            document.getElementById('hName').innerText = name;
            document.getElementById('eFood').value = u.foodPlan;
            document.getElementById('eGym').value = u.gymPlan;
            document.getElementById('editOverlay').style.display='block';
            loadAMsgs();
            cInt = setInterval(loadAMsgs, 3000);
        }

        function closeEdit() { document.getElementById('editOverlay').style.display='none'; clearInterval(cInt); }

        async function loadAMsgs() {
            const res = await fetch(`${dbURL}/messages/${encodeURIComponent(currE)}.json`);
            const msgs = await res.json();
            const box = document.getElementById('adminChatBox');
            if(msgs) {
                box.innerHTML = '';
                for(let id in msgs) {
                    const m = msgs[id];
                    if(m.sender==='user' && m.status!=='seen') fetch(`${dbURL}/messages/${encodeURIComponent(currE)}/${id}/status.json`, { method:'PUT', body:'"seen"' });
                    box.innerHTML += `<div class="a-msg ${m.sender==='admin'?'from-admin':'from-user'}">${m.content}</div>`;
                }
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendA() {
            const txt = document.getElementById('aInput').value.trim();
            if(!txt) return;
            const data = { type:'text', content:txt, sender:'admin', time: new Date().toLocaleTimeString('ar-EG'), status:'sent' };
            await fetch(`${dbURL}/messages/${encodeURIComponent(currE)}.json`, { method:'POST', body: JSON.stringify(data) });
            document.getElementById('aInput').value = '';
        }
    </script>
</body>
</html>
