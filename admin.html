<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وحوش الفينوم 👑</title>
    <style>
        :root { --main-color: #ff4757; --bg-dark: #0a0a0a; --card-bg: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg-dark); color: white; margin: 0; padding: 20px; text-align: center; }
        .admin-box { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        button { background: var(--main-color); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .user-list { text-align: right; margin-top: 30px; }
        .user-item { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid var(--main-color); }
        .delete-btn { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.3s; width: auto; margin: 0; }
        .delete-btn:hover { background: #ff4757; }
        .user-info { flex-grow: 1; margin-left: 10px; }
    </style>
</head>
<body>

    <h2 style="color: var(--main-color);">لوحة تحكم VENOM GYM 👑</h2>

    <div class="admin-box">
        <h3>إضافة أو تحديث وحش</h3>
        <input type="text" id="userName" placeholder="اسم المتدرب">
        <textarea id="foodPlan" placeholder="النظام الغذائي" rows="3"></textarea>
        <textarea id="gymPlan" placeholder="برنامج التمرين" rows="3"></textarea>
        <button onclick="saveUser()">حفظ البيانات 💾</button>
    </div>

    <div class="user-list">
        <h3>المشتركين الحاليين:</h3>
        <div id="usersContainer">جاري التحميل...</div>
    </div>

    <script>
        const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com/users";

        // جلب المشتركين وعرضهم
        async function fetchUsers() {
            try {
                const res = await fetch(`${dbURL}.json`);
                const data = await res.json();
                const container = document.getElementById('usersContainer');
                container.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(name => {
                        const div = document.createElement('div');
                        div.className = 'user-item';
                        div.innerHTML = `
                            <div class="user-info">
                                <strong>${name}</strong>
                            </div>
                            <button class="delete-btn" onclick="deleteUser('${name}')">حذف 🗑️</button>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = 'لا يوجد مشتركين حالياً.';
                }
            } catch (e) { console.error(e); }
        }

        // حفظ أو تحديث
        async function saveUser() {
            const name = document.getElementById('userName').value.trim();
            const food = document.getElementById('foodPlan').value.trim();
            const gym = document.getElementById('gymPlan').value.trim();

            if (!name) return alert("اكتب الاسم!");

            await fetch(`${dbURL}/${name}.json`, {
                method: 'PUT',
                body: JSON.stringify({ foodPlan: food, gymPlan: gym })
            });
            alert("تم الحفظ بنجاح!");
            fetchUsers();
        }

        // حذف عضو
        async function deleteUser(name) {
            if (confirm(`هل أنت متأكد من حذف البطل (${name})؟`)) {
                try {
                    await fetch(`${dbURL}/${name}.json`, { method: 'DELETE' });
                    alert("تم الحذف!");
                    fetchUsers();
                } catch (e) { alert("حدث خطأ في الحذف"); }
            }
        }

        // تحميل القائمة عند فتح الصفحة
        fetchUsers();
    </script>
</body>
</html>
