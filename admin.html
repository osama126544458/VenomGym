<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم 👑</title>
    <style>
        :root { --main: #ff4757; --dark: #0a0a0a; --card: #1a1a1a; --blue: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 15px; }
        .user-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: #ff4757; border: none; color: white; padding: 8px; border-radius: 8px; cursor: pointer; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--dark); display:none; padding:20px; box-sizing:border-box; z-index:100; }
        #adminChatBox { height: 300px; overflow-y: auto; background: #0d1418; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
        .a-msg { padding: 8px; border-radius: 8px; max-width: 80%; font-size: 13px; }
        .f-admin { background: #005c4b; align-self: flex-end; }
        .f-user { background: #202c33; align-self: flex-start; }
    </style>
</head>
<body>

    <h2 style="text-align:center">إدارة الأبطال 👑</h2>
    <div id="uList"></div>

    <div id="chatOverlay" class="overlay">
        <button onclick="closeChat()" style="background:#333; color:white; border:none; padding:10px; border-radius:8px;">إغلاق</button>
        <h3 id="targetName" style="text-align:center"></h3>
        <div id="adminChatBox"></div>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <input type="text" id="adminInput" style="flex:1; padding:10px; border-radius:8px; border:none; background:#222; color:white;">
            <button onclick="sendAdminMsg()" style="background:var(--main); border:none; color:white; padding:10px; border-radius:8px;">إرسال</button>
        </div>
    </div>

    <script>
        const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com";
        let currU = "", cInt;

        async function loadU() {
            const res = await fetch(`${dbURL}/users.json`);
            const data = await res.json() || {};
            const list = document.getElementById('uList'); list.innerHTML = '';
            Object.keys(data).forEach(name => {
                list.innerHTML += `
                    <div class="user-card">
                        <span onclick="openChat('${name}')" style="cursor:pointer; flex:1">👤 ${name}</span>
                        <button class="del-btn" onclick="deleteUser('${name}')">حذف 🗑️</button>
                    </div>`;
            });
        }

        async function deleteUser(name) {
            if(confirm(`حذف ${name}؟`)) {
                await fetch(`${dbURL}/users/${encodeURIComponent(name)}.json`, { method:'DELETE' });
                await fetch(`${dbURL}/messages/${encodeURIComponent(name)}.json`, { method:'DELETE' });
                loadU();
            }
        }

        function openChat(name) {
            currU = name; document.getElementById('targetName').innerText = name;
            document.getElementById('chatOverlay').style.display='block';
            loadMsgs(); cInt = setInterval(loadMsgs, 3000);
        }

        function closeChat() { document.getElementById('chatOverlay').style.display='none'; clearInterval(cInt); }

        async function loadMsgs() {
            const res = await fetch(`${dbURL}/messages/${encodeURIComponent(currU)}.json`);
            const msgs = await res.json();
            const box = document.getElementById('adminChatBox');
            if(msgs) {
                box.innerHTML = '';
                Object.keys(msgs).forEach(id => {
                    const m = msgs[id];
                    if(m.sender==='user' && m.status!=='seen') fetch(`${dbURL}/messages/${encodeURIComponent(currU)}/${id}/status.json`, { method:'PUT', body:'"seen"' });
                    let ticks = m.sender==='admin' ? `<span style="color:${m.status==='seen'?'#3498db':'#888'}">✓✓</span>` : '';
                    box.innerHTML += `<div class="a-msg ${m.sender==='admin'?'f-admin':'f-user'}">${m.content} <small style="font-size:8px">${ticks}</small></div>`;
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendAdminMsg() {
            const txt = document.getElementById('adminInput').value;
            if(!txt) return;
            const data = { content:txt, sender:'admin', time: new Date().toLocaleTimeString('ar-EG'), status:'sent' };
            await fetch(`${dbURL}/messages/${encodeURIComponent(currU)}.json`, { method:'POST', body:JSON.stringify(data)});
            document.getElementById('adminInput').value = '';
        }

        loadU();
    </script>
</body>
</html>
