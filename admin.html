<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة فينوم جيم - PRO 👑</title>
    <style>
        :root { --main: #ff4757; --dark: #0a0a0a; --card: #1a1a1a; --green: #2ed573; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 0; }
        .navbar { background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 100; }
        .nav-btn { color: #888; cursor: pointer; font-weight: bold; font-size: 14px; }
        .nav-btn.active { color: var(--main); border-bottom: 2px solid var(--main); }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .btn-save { background: var(--main); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .user-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border-right: 5px solid #444; position: relative; cursor: pointer; }
        .status-tag { position: absolute; left: 15px; top: 15px; font-size: 11px; padding: 4px 8px; border-radius: 5px; }
        .paid { background: var(--green); color: black; }
        .unpaid { background: var(--main); color: white; }
        .edit-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 200; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-btn active" id="btnA" onclick="showPage('addPage')">➕ إضافة بطل</div>
        <div class="nav-btn" id="btnL" onclick="showPage('listPage')">👥 إدارة المشتركين</div>
    </div>

    <div class="container">
        <div id="addPage" class="page active">
            <h2>تسجيل مشترك جديد 🔥</h2>
            <div class="card">
                <input type="text" id="newName" placeholder="اسم البطل">
                <div style="display: flex; gap: 10px;">
                    <input type="date" id="startDate">
                    <select id="duration">
                        <option value="30">شهر واحد</option>
                        <option value="90">3 شهور</option>
                    </select>
                </div>
                <select id="paymentStatus">
                    <option value="paid">تم الدفع ✅</option>
                    <option value="unpaid">لم يدفع بعد ❌</option>
                </select>
                <textarea id="newFood" placeholder="نظام التغذية..." rows="3"></textarea>
                <textarea id="newGym" placeholder="برنامج التمرين..." rows="3"></textarea>
                <button class="btn-save" onclick="saveUser()">حفظ البيانات 💾</button>
            </div>
        </div>

        <div id="listPage" class="page">
            <h2>إدارة الأبطال 🔍</h2>
            <input type="text" id="searchBar" placeholder="ابحث بالاسم..." oninput="search()">
            <div id="usersList" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="editOverlay" class="edit-overlay">
        <button onclick="closeEdit()" style="background:#333; color:white; border:none; padding:10px; border-radius:8px; margin-bottom:20px;">⬅️ رجوع</button>
        <div class="card">
            <h3>تعديل بطل: <span id="editNameHeader" style="color:var(--main)"></span></h3>
            <label>حالة الدفع:</label>
            <select id="editPayment">
                <option value="paid">تم الدفع ✅</option>
                <option value="unpaid">لم يدفع ❌</option>
            </select>
            <label>تاريخ الاشتراك:</label>
            <input type="date" id="editDate">
            <textarea id="editFood" rows="4"></textarea>
            <textarea id="editGym" rows="4"></textarea>
            <button class="btn-save" onclick="updateUser()" style="background:var(--green)">تحديث ✅</button>
            <button class="btn-save" onclick="deleteUser()" style="background:#444; margin-top:10px;">حذف 🗑️</button>
        </div>
    </div>

    <script>
        const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com/users";
        let allUsers = {};
        let currentEdit = "";

        document.getElementById('startDate').valueAsDate = new Date();

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'addPage') document.getElementById('btnA').classList.add('active');
            else { document.getElementById('btnL').classList.add('active'); loadUsers(); }
        }

        async function saveUser() {
            const name = document.getElementById('newName').value.trim();
            if(!name) return alert("الاسم مطلوب!");
            const data = {
                startDate: document.getElementById('startDate').value,
                duration: document.getElementById('duration').value,
                payment: document.getElementById('paymentStatus').value,
                foodPlan: document.getElementById('newFood').value,
                gymPlan: document.getElementById('newGym').value
            };
            await fetch(`${dbURL}/${name}.json`, { method: 'PUT', body: JSON.stringify(data) });
            alert("تم الحفظ!");
            location.reload();
        }

        async function loadUsers() {
            const res = await fetch(`${dbURL}.json`);
            allUsers = await res.json() || {};
            render(allUsers);
        }

        function render(data) {
            const list = document.getElementById('usersList');
            list.innerHTML = '';
            Object.keys(data).forEach(name => {
                const user = data[name];
                const end = new Date(user.startDate);
                end.setDate(end.getDate() + parseInt(user.duration));
                const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
                const statusClass = user.payment === 'paid' ? 'paid' : 'unpaid';
                const div = document.createElement('div');
                div.className = 'user-card';
                div.onclick = () => openEdit(name);
                div.innerHTML = `<span class="status-tag ${statusClass}">${user.payment === 'paid' ? 'مدفوع' : 'غير مدفوع'}</span>
                                 <strong>👤 ${name}</strong><br><small>⏳ متبقي: ${diff} يوم</small>`;
                list.appendChild(div);
            });
        }

        function search() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const filtered = {};
            Object.keys(allUsers).forEach(n => { if(n.toLowerCase().includes(term)) filtered[n] = allUsers[n]; });
            render(filtered);
        }

        function openEdit(name) {
            currentEdit = name;
            const u = allUsers[name];
            document.getElementById('editNameHeader').innerText = name;
            document.getElementById('editPayment').value = u.payment;
            document.getElementById('editDate').value = u.startDate;
            document.getElementById('editFood').value = u.foodPlan;
            document.getElementById('editGym').value = u.gymPlan;
            document.getElementById('editOverlay').style.display = 'block';
        }

        function closeEdit() { document.getElementById('editOverlay').style.display = 'none'; }

        async function updateUser() {
            const data = {
                payment: document.getElementById('editPayment').value,
                startDate: document.getElementById('editDate').value,
                foodPlan: document.getElementById('editFood').value,
                gymPlan: document.getElementById('editGym').value,
                duration: allUsers[currentEdit].duration
            };
            await fetch(`${dbURL}/${currentEdit}.json`, { method: 'PATCH', body: JSON.stringify(data) });
            alert("تم التحديث!");
            closeEdit(); loadUsers();
        }

        async function deleteUser() {
            if(confirm("حذف؟")) { await fetch(`${dbURL}/${currentEdit}.json`, { method: 'DELETE' }); closeEdit(); loadUsers(); }
        }
    </script>
</body>
</html>
