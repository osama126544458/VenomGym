<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 VENOM GYM</title>
    <style>
        :root { --main: #ff4757; --dark: #0a0a0a; --card: #1a1a1a; --user-msg: #202c33; --admin-msg: #005c4b; --blue: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; max-width: 450px; margin: auto; position: relative; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        button { background: var(--main); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #chatPage { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 10px; box-sizing: border-box; }
        #chatBox { height: calc(100% - 130px); overflow-y: auto; background: #0d1418; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; position: relative; }
        .admin-msg { background: var(--admin-msg); align-self: flex-start; }
        .user-msg { background: var(--user-msg); align-self: flex-end; }
        .msg-badge { position: absolute; top: -5px; right: -5px; background: var(--main); color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; }
    </style>
</head>
<body>

    <div id="loginBox" class="card" style="margin-top: 50px;">
        <h3 style="text-align:center">دخول الأبطال 🔥</h3>
        <input type="text" id="userName" placeholder="الاسم الثلاثي...">
        <button onclick="fetchData()">دخول 🚀</button>
    </div>

    <div id="infoBox" style="display:none">
        <div class="card">
            <div onclick="openChat()" style="position:absolute; left:20px; top:20px; cursor:pointer;">
                💬 <span id="globalBadge" class="msg-badge" style="display:none">0</span>
            </div>
            <h2 id="displayName" style="text-align:center; color:var(--main)"></h2>
            <div style="background:#222; padding:15px; border-radius:12px; border-right:5px solid var(--main);">
                <strong>🥗 التغذية:</strong> <p id="foodResult"></p>
            </div>
            <button onclick="logout()" style="background:#444; margin-top:20px;">تسجيل خروج ⬅️</button>
        </div>
    </div>

    <div id="chatPage">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button onclick="closeChat()" style="width:70px; background:#333;">رجوع</button>
            <h3 style="margin:0">الكابتن أسامة 👑</h3>
        </div>
        <div id="chatBox"></div>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <input type="text" id="msgInput" placeholder="اكتب..." style="margin:0; flex:1">
            <button onclick="sendText()" style="width:70px">إرسال</button>
        </div>
    </div>

    <script>
        const dbURL = "https://osamagymapp-default-rtdb.firebaseio.com";
        let currentU = localStorage.getItem("gymUser"), isChatOpen = false;

        // فحص لو العميل مسجل دخول قبل كدة
        if(currentU) { fetchData(currentU); }

        async function fetchData(savedName) {
            const name = savedName || document.getElementById('userName').value.trim();
            if(!name) return;
            const res = await fetch(`${dbURL}/users/${encodeURIComponent(name)}.json`);
            const data = await res.json();
            if(!data) { localStorage.removeItem("gymUser"); return alert("الاسم غير مسجل!"); }
            
            localStorage.setItem("gymUser", name);
            currentU = name;
            document.getElementById('loginBox').style.display='none';
            document.getElementById('infoBox').style.display='block';
            document.getElementById('displayName').innerText = name;
            document.getElementById('foodResult').innerText = data.foodPlan || "قريباً";
            listenToMessages();
        }

        function logout() { localStorage.removeItem("gymUser"); location.reload(); }
        function openChat() { isChatOpen = true; document.getElementById('chatPage').style.display='block'; markAsSeen(); }
        function closeChat() { isChatOpen = false; document.getElementById('chatPage').style.display='none'; }

        async function sendText() {
            const val = document.getElementById('msgInput').value.trim();
            if(!val) return;
            const data = { content:val, sender:'user', time: new Date().toLocaleTimeString('ar-EG'), status:'sent' };
            await fetch(`${dbURL}/messages/${encodeURIComponent(currentU)}.json`, { method:'POST', body:JSON.stringify(data)});
            document.getElementById('msgInput').value = '';
        }

        async function markAsSeen() {
            const res = await fetch(`${dbURL}/messages/${encodeURIComponent(currentU)}.json`);
            const msgs = await res.json();
            if(msgs) Object.keys(msgs).forEach(id => {
                if(msgs[id].sender === 'admin') fetch(`${dbURL}/messages/${encodeURIComponent(currentU)}/${id}/status.json`, { method:'PUT', body: '"seen"' });
            });
        }

        function listenToMessages() {
            setInterval(async () => {
                const res = await fetch(`${dbURL}/messages/${encodeURIComponent(currentU)}.json`);
                const msgs = await res.json();
                const box = document.getElementById('chatBox');
                if(msgs) {
                    box.innerHTML = '';
                    Object.values(msgs).forEach(m => {
                        let ticks = m.sender==='user' ? `<span style="color:${m.status==='seen'?'#3498db':'#888'}">✓✓</span>` : '';
                        box.innerHTML += `<div class="msg ${m.sender==='admin'?'admin-msg':'user-msg'}">${m.content}<br><small style="font-size:9px;">${m.time} ${ticks}</small></div>`;
                    });
                    if(isChatOpen) { box.scrollTop = box.scrollHeight; markAsSeen(); }
                }
            }, 3000);
        }
    </script>
</body>
</html>
